spring.application.name=exoplanetes-api

# ---------------------------------------------------------------------------
# Datasource : pointe vers le PostgreSQL lance par docker-compose.yml
# ---------------------------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/exoplanetes
# spring.datasource.username=exo
# spring.datasource.password=exo

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exoplanetes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:exo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:exo}


# ---------------------------------------------------------------------------
# Hibernate / JPA
# ---------------------------------------------------------------------------
# validate = Hibernate VERIFIE que tes @Entity collent au schema cree par
# Flyway, mais ne modifie JAMAIS la base (pas de create/update). Si une
# colonne/table manque ou ne correspond pas, le demarrage ECHOUE. C'est
# exactement ce qu'on veut : Flyway est la seule source de verite du schema.
spring.jpa.hibernate.ddl-auto=validate

# open-in-view=false : la session Hibernate est FERMEE des la sortie de la
# couche @Transactional (service). Consequence : tout acces a une relation
# LAZY dans le controller ou pendant la serialisation JSON leve une
# LazyInitializationException. C'est VOULU : ca t'oblige a charger
# explicitement ce dont tu as besoin (fetch join, DTO...). Piege classique.
spring.jpa.open-in-view=false

# Formatage du SQL logue (lisible). Decommente show-sql pour OBSERVER les
# requetes reellement emises par Hibernate -> indispensable pour debusquer
# les N+1 (une requete "liste" suivie de N requetes "SELECT ... WHERE id=?").
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Flyway : joue les migrations db/migration/V*.sql au demarrage
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Erreurs : ne jamais fuiter de stack trace dans les reponses HTTP
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=always
