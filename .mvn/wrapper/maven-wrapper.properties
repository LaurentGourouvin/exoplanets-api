# Maven Wrapper — configuration (variante jar-based, comme Spring Initializr).
# Au 1er ./mvnw :
#   - maven-wrapper.jar est telecharge depuis wrapperUrl s'il est absent ;
#   - Maven lui-meme est telecharge/decompresse depuis distributionUrl.
# Necessite un acces reseau la premiere fois (ensuite tout est mis en cache).
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
